name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify-release:
    name: Verify exact release commit
    runs-on: ubuntu-latest
    env:
      CYDETIX_EXPECTED_SOURCE_SHA: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Require approved identity and private reporting
        run: npm run validate:publication-config
      - name: Require annotated tag, version, commit, changelog, and notes consistency
        env:
          CYDETIX_EXPECTED_TAG: ${{ github.ref_name }}
        run: npm run validate:release-context
      - name: Require successful exact-commit hosted CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run validate:hosted-workflow -- ci.yml
      - name: Require successful exact-commit CodeQL run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run validate:hosted-workflow -- codeql.yml
      - name: Require successful exact-commit OpenSSF run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run validate:hosted-workflow -- scorecard.yml
      - name: Reject unsanitized reachable history
        env:
          CYDETIX_EXPECTED_TAG: ${{ github.ref_name }}
        run: >-
          node scripts/run-source-bound-command.mjs --type git-history-privacy --output
          .cydetix/evidence/bound/git-history-privacy.json --capture-stdout
          .cydetix/evidence/history.json -- node scripts/audit-git-history.mjs --enforce --ref
          "refs/tags/${CYDETIX_EXPECTED_TAG}"
      - name: Pull reviewed immutable sandbox and secret-scanner images
        shell: bash
        run: |
          docker pull node@sha256:1b2479dd35a99687d6638f5976fd235e26c5b37e8122f786fcd5fe231d63de5b
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Independently scan complete history
        shell: bash
        run: |
          mkdir -p .cydetix/evidence
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            echo "Repository-controlled .gitleaksignore is forbidden in the release scan" >&2
            exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 512m --cpus 1 \
            --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --mount "type=bind,source=$PWD/.cydetix/evidence,target=/evidence" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact=100 --report-format json --report-path /evidence/gitleaks.json \
            --config /repo/validation/gitleaks.toml \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --log-opts="--full-history --all --text --no-textconv --no-ext-diff" \
            --no-banner --no-color --exit-code 0 --timeout 180
          node scripts/run-source-bound-command.mjs \
            --type complete-history-gitleaks \
            --output .cydetix/evidence/bound/complete-history-gitleaks.json \
            --subject .cydetix/evidence/gitleaks-review.json \
            -- node scripts/validate-gitleaks-report.mjs .cydetix/evidence/gitleaks.json
      - name: Run npm advisory gate
        run: >-
          node scripts/run-source-bound-command.mjs --type npm-audit --output
          .cydetix/evidence/bound/npm-audit.json --capture-stdout .cydetix/evidence/npm-audit.txt --
          npm audit --audit-level=high
      - name: Run complete verification with mandatory sandbox tests
        env:
          CYDETIX_SANDBOX_IMAGE: node@sha256:1b2479dd35a99687d6638f5976fd235e26c5b37e8122f786fcd5fe231d63de5b
        run: >-
          node scripts/run-source-bound-command.mjs --type development-verification --output
          .cydetix/evidence/bound/development-verification.json -- npm run verify
      - name: Run explicit online OSV gate
        run: >-
          node scripts/run-source-bound-command.mjs --type online-osv --output
          .cydetix/evidence/bound/online-osv.json --subject .cydetix/evidence/osv-online.json -- npm
          run validate:online-osv
      - name: Record complete test evidence
        run: npm run release:tests
      - name: Record native self-scan evidence
        run: >-
          node scripts/run-source-bound-command.mjs --type self-scan --output
          .cydetix/evidence/bound/self-scan.json --subject .cydetix/evidence/self-scan.json -- npm
          run release:self-scan
      - name: Record public repository audit evidence
        run: >-
          node scripts/run-source-bound-command.mjs --type public-repository --output
          .cydetix/evidence/bound/public-repository.json --capture-stdout
          .cydetix/evidence/public-repository.json -- npm run audit:public-repository
      - name: Record workflow security evidence
        run: >-
          node scripts/run-source-bound-command.mjs --type workflow-security --output
          .cydetix/evidence/bound/workflow-security.json -- npm run validate:workflow-security
      - name: Create explicit release evidence allowlist
        run: >-
          node scripts/create-release-evidence-index.mjs --output .cydetix/evidence/index.json
          .cydetix/evidence/bound/hosted-ci.json .cydetix/evidence/bound/hosted-sandbox.json
          .cydetix/evidence/bound/codeql.json .cydetix/evidence/bound/openssf-scorecard.json
          .cydetix/evidence/bound/git-history-privacy.json
          .cydetix/evidence/bound/complete-history-gitleaks.json
          .cydetix/evidence/bound/npm-audit.json
          .cydetix/evidence/bound/development-verification.json
          .cydetix/evidence/bound/online-osv.json .cydetix/evidence/bound/complete-test-suite.json
          .cydetix/evidence/bound/self-scan.json .cydetix/evidence/bound/public-repository.json
          .cydetix/evidence/bound/workflow-security.json
      - name: Build exact release artifacts and manifest
        env:
          CYDETIX_RELEASE_DIR: release-bundle
          CYDETIX_RELEASE_EVIDENCE_INDEX: .cydetix/evidence/index.json
        run: npm run release:artifacts
      - name: Smoke-test the exact release tarball
        shell: bash
        run: |
          tarball="$(find release-bundle -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          CYDETIX_PACKAGE_TARBALL="$tarball" npm run validate:install
      - name: Validate the exact plugin archive
        env:
          CYDETIX_RELEASE_DIR: release-bundle
        run: npm run validate:packed-plugin
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved release
    needs: verify-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up npm registry for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"
          registry-url: "https://registry.npmjs.org"
      - name: Require a Trusted Publishing-capable npm CLI
        run: >-
          node -e "const {execFileSync}=require('node:child_process'); const
          [major,minor]=execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);
          if(major<11||(major===11&&minor<5))process.exit(1)"
      - name: Download exact verified bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Verify every downloaded checksum
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - name: Attest distributable artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-bundle/*.tgz
            release-bundle/*.tar.gz
            release-bundle/*.json
            release-bundle/SHA256SUMS
      - name: Attest CycloneDX SBOM for the npm tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-bundle/*.tgz
          sbom-path: release-bundle/cydetix.cdx.json
      - name: Create a non-public draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          github_prerelease="$(node scripts/resolve-release-channel.mjs --github-prerelease)"
          prerelease_args=()
          if [ "$github_prerelease" = "true" ]; then
            prerelease_args+=(--prerelease)
          elif [ "$github_prerelease" != "false" ]; then
            echo "Unsupported GitHub prerelease state: $github_prerelease" >&2
            exit 1
          fi
          title="$(node -p "JSON.parse(require('fs').readFileSync('release/publication-config.json')).productName + ' v' + require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" release-bundle/* --verify-tag --draft "${prerelease_args[@]}" \
            --title "$title" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - name: Publish approved package through npm OIDC
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release-bundle/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm_dist_tag="$(node scripts/resolve-release-channel.mjs --npm-dist-tag)"
          npm publish "./${tarballs[0]}" --access public --tag "$npm_dist_tag" --ignore-scripts
      - name: Publish the prepared GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          github_prerelease="$(node scripts/resolve-release-channel.mjs --github-prerelease)"
          if [ "$github_prerelease" != "true" ] && [ "$github_prerelease" != "false" ]; then
            echo "Unsupported GitHub prerelease state: $github_prerelease" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$github_prerelease"
